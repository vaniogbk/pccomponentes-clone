services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcc
      POSTGRES_USER: ${POSTGRES_USER:-pcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD dans .env.local}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - pcc-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d pcc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pcc-postgres-data:
    name: pccomponentes-postgres-data
