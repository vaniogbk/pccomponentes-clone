name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc_ci_only
          POSTGRES_DB: pcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcc -d pcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pcc:pcc_ci_only@localhost:5432/pcc_test?schema=public
      TEST_DATABASE_URL: postgresql://pcc:pcc_ci_only@localhost:5432/pcc_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
